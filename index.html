<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投票即時監控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f7;
    --surface:#ffffff;
    --track:#e7eaf0;
    --border:#cdd3de;
    --text:#090909;
    --text-dim:#5b6376;
    --navy:#0e1f4a;
    --accent-dark:#002d68;
    --accent:#0057b8;
    --accent-light:#0877db;
    --up:#16a34a;
    --down:#dc2626;
    --font: 'Inter', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  .hero{
    background:linear-gradient(125deg, var(--accent-dark) 0%, var(--accent) 58%, var(--accent-light) 100%);
    padding:28px 20px 24px;color:#fff;
  }
  .hero-top{display:flex;align-items:center;gap:14px;}
  .hero-icon{
    width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.82);}
  .hero h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.01em;}
  .live-row{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:14px;}
  .live-dot{width:9px;height:9px;border-radius:50%;background:#4ade80;flex:none;position:relative;}
  .live-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#4ade80;opacity:.4;animation:pulse 2.2s ease-out infinite;}
  .live-dot.stale{background:rgba(255,255,255,.5);}
  .live-dot.stale::after{display:none;}
  @keyframes pulse{0%{transform:scale(.6);opacity:.5;}100%{transform:scale(2.6);opacity:0;}}
  @media (prefers-reduced-motion: reduce){.live-dot::after{animation:none;}}
  .live-label{font-weight:700;letter-spacing:.04em;}
  .live-time{color:rgba(255,255,255,.85);}

  main.body{flex:1;padding:20px 20px 8px;display:flex;flex-direction:column;gap:18px;}

  .selector-label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
  .select-wrap{position:relative;}
  select{
    appearance:none;-webkit-appearance:none;width:100%;
    font-family:var(--font);font-size:14px;color:var(--navy);font-weight:500;
    background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:9px 34px 9px 12px;
  }
  select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .chevron{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-dim);}

  .podium{display:flex;flex-direction:column;gap:10px;}
  .stat-card{
    background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px rgba(14,31,74,.08);
    padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .stat-left{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .stat-rank{font-size:13px;font-weight:700;color:var(--accent);}
  .stat-name{font-size:26px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stat-delta{font-size:12px;color:var(--text-dim);}
  .stat-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;}
  .stat-num{font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--text);}
  .stat-card.rank1 .stat-num{font-size:32px;}
  .stat-card.rank1 .stat-name{font-size:32px;}
  .stat-cap{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--text-dim);}

  .card{background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px rgba(14,31,74,.08);padding:18px;}
  .card h2{font-size:18px;font-weight:700;margin:0;color:var(--text);}
  .card-sub{font-size:12px;color:var(--text-dim);margin:2px 0 12px;}

  .range-picker{display:flex;gap:2px;background:var(--track);padding:4px;border-radius:9px;margin-top:2px;}
  .range-btn{
    flex:1;font-family:var(--font);font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:7px;
    border:none;background:transparent;color:var(--text-dim);cursor:pointer;
  }
  .range-btn[aria-selected="true"]{background:var(--surface);color:var(--text);}
  .range-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .range-note{font-size:11.5px;color:var(--text-dim);margin:10px 0 0;min-height:14px;}
  .chart-wrap{margin-top:10px;position:relative;}
  #bumpChart{width:100%;height:auto;display:block;touch-action:pan-y;}
  .axis-label{fill:var(--text-dim);font-family:var(--font);font-size:10px;}
  .grid-line{stroke:var(--border);stroke-width:1;opacity:.6;}
  .line-path{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;}
  .line-end-label{font-family:var(--font);font-size:14px;font-weight:700;}
  .hover-line{stroke:var(--text-dim);stroke-width:1;stroke-dasharray:3,3;opacity:.6;}
  .hover-dot{stroke:var(--surface);stroke-width:1.5;}

  .chart-tooltip{
    position:absolute;top:0;left:0;z-index:20;pointer-events:none;
    display:none;min-width:132px;max-width:220px;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;box-shadow:0 6px 20px -6px rgba(14,31,74,.28);
    font-family:var(--font);
  }
  .chart-tooltip.visible{display:block;}
  .chart-tooltip-time{
    font-size:11px;font-weight:700;color:var(--text-dim);
    margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums;
  }
  .chart-tooltip-row{display:flex;align-items:center;gap:6px;padding:2px 0;}
  .chart-tooltip-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .chart-tooltip-name{
    flex:1;min-width:0;font-size:12px;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chart-tooltip-value{
    font-size:12px;font-weight:700;color:var(--text);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }

  .rank-list{display:flex;flex-direction:column;}
  .rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .rank-row:last-child{border-bottom:none;}
  .rank-badge{
    width:32px;height:32px;border-radius:8px;background:var(--track);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;
  }
  .rank-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .rank-name{font-size:14.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-meta{font-size:11.5px;color:var(--text-dim);}
  .rank-meta.up{color:var(--up);}
  .rank-meta.down{color:var(--down);}
  .rank-votes{font-size:14.5px;font-weight:700;color:var(--text);flex:none;}

  footer{padding:18px 20px 28px;text-align:center;}
  footer p{margin:0;color:var(--text-dim);font-size:11px;line-height:1.6;}

  .error-banner{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    background:var(--navy);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.4);max-width:90vw;text-align:center;z-index:50;
  }
  .skeleton{color:var(--text-dim);font-size:13px;padding:24px;text-align:center;}

  @media (min-width:700px){
    .page{max-width:900px;}
    .hero{padding:36px 32px 30px;}
    main.body{padding:28px 32px 12px;gap:22px;}
    .podium{flex-direction:row;}
    .stat-card{flex:1;flex-direction:column;align-items:flex-start;gap:14px;}
    .stat-right{align-items:flex-start;}
    .stat-card.rank1 .stat-num{font-size:36px;}
    .stat-card.rank1 .stat-name{font-size:36px;}
    .rank-list{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;}
    footer{padding:22px 32px 32px;}
  }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="hero-top">
      <span class="hero-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 20 5v6c0 5-3.4 8.4-8 9-4.6-.6-8-4-8-9V5z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </span>
      <div>
        <p class="eyebrow">FUBON VOTE MONITOR</p>
        <h1>即時票數與排名</h1>
      </div>
    </div>
    <div class="live-row">
      <span class="live-dot" id="liveDot"></span>
      <span class="live-label">LIVE</span>
      <span class="live-time" id="updatedAt">載入中…</span>
    </div>
  </header>

  <main class="body" id="main">
    <section class="selector">
      <label class="selector-label" for="activitySelect">投票活動</label>
      <div class="select-wrap">
        <select id="activitySelect"></select>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </section>

    <section class="podium" id="podium" aria-label="目前前三名"></section>

    <section class="card">
      <h2>排名變化</h2>
      <p class="card-sub">縱軸依票數高低繪製（非名次等距）</p>
      <div class="range-picker" id="rangePicker" role="tablist" aria-label="時間範圍"></div>
      <div class="range-note" id="rangeNote"></div>
      <div class="chart-wrap">
        <svg id="bumpChart" viewBox="0 0 820 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="票數排名走勢圖"></svg>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </section>

    <section class="card">
      <h2>即時排行榜</h2>
      <div class="rank-list" id="rankList"></div>
    </section>
  </main>

  <footer>
    <p>資料取自富邦悍將 App 公開顯示之投票結果；僅讀取，不執行投票。約每分鐘更新一次。</p>
  </footer>
</div>

<div id="errorBanner" class="error-banner" hidden></div>

<script>
(function(){
  "use strict";

  var ACTIVITIES = [
    {id:28, label:'Fubon Angels mini 人氣投票'},
    {id:29, label:'悍將中學校草'},
    {id:30, label:'校花・才藝系'},
    {id:31, label:'校花・甜美系'},
    {id:32, label:'校花・氣質系'},
    {id:33, label:'校花・開朗系'},
    {id:34, label:'校花・俏皮系'}
  ];

  var RANGES = [
    {key:'30m', label:'30 分鐘', ms: 30*60*1000},
    {key:'1h',  label:'1 小時',  ms: 60*60*1000},
    {key:'12h', label:'12 小時', ms: 12*60*60*1000},
    {key:'1d',  label:'1 天',    ms: 24*60*60*1000},
    {key:'all', label:'全部',    ms: Infinity}
  ];

  var PALETTE = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#17becf'];

  var state = {
    activityId: ACTIVITIES[0].id,
    rangeKey: '30m',
    cache: {},
    refreshTimer: null
  };

  // snapshot of the chart's current scales/data, refreshed on every
  // renderChart() call so the hover handler (attached once, outside the
  // render cycle) always reads the latest layout
  var chartState = null;

  function $(id){ return document.getElementById(id); }

  function showError(msg){
    try{
      var el = $('errorBanner');
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(showError._t);
      showError._t = setTimeout(function(){ el.hidden = true; }, 5000);
    }catch(e){ /* never let error reporting itself throw */ }
  }

  function fetchActivity(id){
    var url = './data/history-' + id + '.json?t=' + Date.now();
    return fetch(url, {cache:'no-store'})
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        var pts = (data && Array.isArray(data.points)) ? data.points : [];
        state.cache[id] = pts;
        return pts;
      });
  }

  function fetchAll(){
    return Promise.allSettled(ACTIVITIES.map(function(a){ return fetchActivity(a.id); }));
  }

  // ---------- formatting helpers ----------

  function formatVotes(v){
    return Number(v).toLocaleString('zh-Hant');
  }

  function formatClock(epochSec){
    var d = new Date(epochSec*1000);
    return d.toLocaleTimeString('zh-Hant', {hour:'2-digit', minute:'2-digit', hour12:false});
  }

  function formatUpdatedAt(epochSec){
    if(epochSec == null) return '尚無資料';
    var d = new Date(epochSec*1000);
    var md = (d.getMonth()+1) + '/' + d.getDate();
    var diffMin = Math.round((Date.now()/1000 - epochSec)/60);
    var suffix = diffMin <= 0 ? '（剛剛更新）' : diffMin < 60 ? '（' + diffMin + ' 分鐘前）' : '（' + Math.floor(diffMin/60) + ' 小時前）';
    return md + ' ' + formatClock(epochSec) + ' 更新 ' + suffix;
  }

  function formatSpan(ms){
    var min = Math.round(ms/60000);
    if(min < 60) return min + ' 分鐘';
    var h = Math.floor(min/60), m = min%60;
    return h + ' 小時' + (m ? ' ' + m + ' 分鐘' : '');
  }

  function roundNice(v){
    if(v <= 0) return 0;
    var exp = Math.floor(Math.log10(v));
    var base = v / Math.pow(10, exp);
    var niceBase = base < 1.5 ? 1 : base < 3 ? 2 : base < 7 ? 5 : 10;
    return niceBase * Math.pow(10, exp);
  }

  // fits an axis to [min,max] with ~count nice-numbered ticks, padding out
  // to a round step rather than always anchoring the low end at 0
  function niceDomain(min, max, count){
    if(min === max){ min = Math.max(0, min - 1); max = max + 1; }
    var rawStep = (max - min) / Math.max(1, count - 1);
    var step = roundNice(rawStep) || 1;
    var niceMin = Math.max(0, Math.floor(min / step) * step);
    var niceMax = Math.ceil(max / step) * step;
    var ticks = [];
    for(var v = niceMin; v <= niceMax + step*0.5; v += step){ ticks.push(Math.round(v)); }
    return {min:niceMin, max:niceMax, ticks:ticks};
  }

  // clean, round time marks (on the hour/half-hour/etc.) instead of
  // arbitrary interpolated instants
  var TIME_STEPS = [60,300,600,900,1800,3600,2*3600,3*3600,4*3600,6*3600,12*3600,24*3600,2*86400,3*86400,7*86400];
  function computeTimeTicks(tMin, tMax, targetCount){
    var span = tMax - tMin;
    if(span <= 0) return [tMin];
    var rawStep = span / Math.max(1, targetCount - 1);
    var step = TIME_STEPS[TIME_STEPS.length - 1];
    for(var i=0;i<TIME_STEPS.length;i++){ if(TIME_STEPS[i] >= rawStep){ step = TIME_STEPS[i]; break; } }
    var start = Math.ceil(tMin / step) * step;
    var ticks = [];
    for(var t = start; t <= tMax; t += step){ ticks.push(t); }
    if(!ticks.length) ticks.push(Math.round((tMin+tMax)/2));
    return ticks;
  }

  // some activities (e.g. 悍將中學校草) store "稱號 - 姓名"; show just the
  // name. matching against stored history still uses the raw name, only
  // the rendered label is shortened.
  function displayName(name){
    var parts = String(name).split(' - ');
    var n = parts.length > 1 ? parts[parts.length-1].trim() : name;
    return n.replace(/#\d+$/, '');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- derived data ----------

  function currentPoints(){
    return state.cache[state.activityId] || [];
  }

  function filteredPoints(){
    var pts = currentPoints();
    if(pts.length === 0) return [];
    var range = RANGES.filter(function(r){ return r.key === state.rangeKey; })[0];
    if(!range || range.ms === Infinity) return pts;
    var cutoff = Date.now()/1000 - range.ms/1000;
    var f = pts.filter(function(p){ return p[0] >= cutoff; });
    return f.length ? f : pts.slice(-1);
  }

  function latestSnapshot(){
    var pts = currentPoints();
    return pts.length ? pts[pts.length-1] : null;
  }

  // the x-axis domain a selected range should draw as. When history
  // actually reaches back past the requested range (e.g. "12 小時" chosen
  // with 30 hours on hand), the axis spans the full 12 hours the button
  // promises -- the oldest plotted point can still land somewhat later
  // than that if the older data happens to be sparse there, same as any
  // point in the middle of the line, but the axis itself isn't cut short
  // by that sparseness. Only when history genuinely doesn't reach back
  // that far does the domain shrink to what's actually available.
  function chartDomain(){
    var allPts = currentPoints();
    var pts = filteredPoints();
    var range = RANGES.filter(function(r){ return r.key === state.rangeKey; })[0];
    if(!pts.length){
      return {pts:pts, domainMin:null, domainMax:null, hasFullCoverage:false};
    }
    if(!range || range.ms === Infinity){
      return {pts:pts, domainMin:pts[0][0], domainMax:pts[pts.length-1][0], hasFullCoverage:true};
    }
    var cutoff = Date.now()/1000 - range.ms/1000;
    var hasFullCoverage = allPts.length > 0 && allPts[0][0] <= cutoff;
    return {
      pts:pts,
      domainMin: hasFullCoverage ? cutoff : pts[0][0],
      domainMax: pts[pts.length-1][0],
      hasFullCoverage: hasFullCoverage
    };
  }

  // ---------- rendering: selector ----------

  function renderSelector(){
    var sel = $('activitySelect');
    sel.innerHTML = '';
    ACTIVITIES.forEach(function(a){
      var opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.label;
      sel.appendChild(opt);
    });
    sel.value = state.activityId;
    sel.addEventListener('change', function(){
      state.activityId = Number(sel.value);
      renderAll();
    });
  }

  function renderRangePicker(){
    var wrap = $('rangePicker');
    wrap.innerHTML = '';
    RANGES.forEach(function(r){
      var btn = document.createElement('button');
      btn.className = 'range-btn';
      btn.type = 'button';
      btn.role = 'tab';
      btn.textContent = r.label;
      btn.setAttribute('aria-selected', String(r.key === state.rangeKey));
      btn.addEventListener('click', function(){
        state.rangeKey = r.key;
        renderRangePicker();
        renderChart();
        renderRangeNote();
      });
      wrap.appendChild(btn);
    });
  }

  function renderRangeNote(){
    var note = $('rangeNote');
    var pts = currentPoints();
    if(pts.length < 2){
      var f = filteredPoints();
      note.textContent = f.length ? '目前僅有 1 筆資料，累積更多資料後走勢圖會逐漸展開。' : '';
      return;
    }
    var d = chartDomain();
    var span = (d.domainMax - d.domainMin) * 1000;
    note.textContent = '資料涵蓋範圍：' + formatSpan(span) + '。';
  }

  // ---------- rendering: podium ----------

  function rankChangeInfo(name, idx, baseline){
    if(!baseline) return null;
    var prevIdx = -1;
    for(var i=0;i<baseline.length;i++){ if(baseline[i][0]===name){ prevIdx=i; break; } }
    if(prevIdx === -1) return {isNew:true};
    var rankDiff = (prevIdx+1) - (idx+1);
    var voteDiff = null;
    return {isNew:false, rankDiff:rankDiff, prevVotes: baseline[prevIdx][1]};
  }

  function renderPodium(){
    var wrap = $('podium');
    var snap = latestSnapshot();
    wrap.innerHTML = '';
    if(!snap){
      wrap.innerHTML = '<div class="skeleton">尚無資料</div>';
      return;
    }
    var items = snap[1];
    var f = filteredPoints();
    var baseline = f.length ? f[0][1] : null;
    var range = RANGES.filter(function(r){ return r.key === state.rangeKey; })[0];

    items.slice(0,3).forEach(function(item, idx){
      var name = item[0], votes = item[1];
      var tile = document.createElement('div');
      tile.className = 'stat-card' + (idx===0 ? ' rank1' : '');
      var delta = 0;
      if(baseline){
        var prev = baseline.filter(function(b){ return b[0]===name; })[0];
        delta = prev ? votes - prev[1] : votes;
      }
      tile.innerHTML =
        '<div class="stat-left">' +
          '<span class="stat-rank">#' + (idx+1) + '</span>' +
          '<span class="stat-name">' + escapeHtml(displayName(name)) + '</span>' +
          '<span class="stat-delta">最近' + range.label + '增加 ' + formatVotes(Math.max(0,delta)) + ' 票</span>' +
        '</div>' +
        '<div class="stat-right">' +
          '<span class="stat-num">' + formatVotes(votes) + '</span>' +
          '<span class="stat-cap">總票數</span>' +
        '</div>';
      wrap.appendChild(tile);
    });
  }

  // ---------- rendering: rank list ----------

  function renderRankList(){
    var wrap = $('rankList');
    wrap.innerHTML = '';
    var snap = latestSnapshot();
    if(!snap){ wrap.innerHTML = '<div class="skeleton">尚無資料</div>'; return; }
    var items = snap[1];
    var f = filteredPoints();
    var baseline = f.length ? f[0][1] : null;

    items.forEach(function(item, idx){
      var name = item[0], votes = item[1];
      var row = document.createElement('div');
      row.className = 'rank-row';
      var meta;
      if(!baseline){
        meta = '<span class="rank-meta">—</span>';
      } else {
        var info = rankChangeInfo(name, idx, baseline);
        if(info.isNew){
          meta = '<span class="rank-meta up">新進榜 · 增加 ' + formatVotes(votes) + ' 票</span>';
        } else {
          var voteDiff = votes - info.prevVotes;
          var cls = info.rankDiff>0 ? 'up' : info.rankDiff<0 ? 'down' : '';
          var rankTxt = info.rankDiff>0 ? '上升 ' + info.rankDiff + ' 名' : info.rankDiff<0 ? '下降 ' + (-info.rankDiff) + ' 名' : '排名不變';
          meta = '<span class="rank-meta ' + cls + '">' + rankTxt + ' · 增加 ' + formatVotes(Math.max(0,voteDiff)) + ' 票</span>';
        }
      }
      row.innerHTML =
        '<span class="rank-badge">' + (idx+1) + '</span>' +
        '<div class="rank-info">' +
          '<span class="rank-name">' + escapeHtml(displayName(name)) + '</span>' +
          meta +
        '</div>' +
        '<span class="rank-votes">' + formatVotes(votes) + '</span>';
      wrap.appendChild(row);
    });
  }

  // ---------- rendering: chart ----------

  function renderChart(){
    var svg = $('bumpChart');
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    hideChartHover();

    var wrap = svg.parentElement;
    var W = Math.max(280, Math.round(wrap.clientWidth || 380));

    var domain = chartDomain();
    var pts = domain.pts;
    if(pts.length === 0){
      chartState = null;
      var H0 = 240;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H0);
      var t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', String(W/2)); t.setAttribute('y', String(H0/2));
      t.setAttribute('text-anchor','middle');
      t.setAttribute('class','axis-label');
      t.textContent = '尚無足夠資料繪製走勢圖';
      svg.appendChild(t);
      return;
    }

    var tMin = domain.domainMin, tMax = domain.domainMax;
    if(tMax === tMin) tMax = tMin + 1;

    var latest = pts[pts.length-1][1];
    // fewer simultaneous lines means less crowding at the low end when a
    // couple of candidates dominate and the rest are bunched together
    var topNames = latest.slice(0, 6).map(function(it){ return it[0]; });

    // right margin only needs to fit whatever these particular names
    // render as -- a fixed guess wasted a lot of width on narrow phone
    // screens once bib-number tags were stripped and names got short.
    // the SVG's viewBox width always equals its rendered CSS width (see
    // W above), so 1 user unit really is 1 px and this estimate holds.
    var maxLabelWidth = topNames.reduce(function(m, name){
      var text = displayName(name), w = 0;
      for(var i=0;i<text.length;i++){ w += text.charCodeAt(i) > 0x2E80 ? 15 : 8.5; }
      return Math.max(m, w);
    }, 0);
    var padR = Math.max(50, Math.min(110, Math.round(maxLabelWidth + 18)));

    // height scales with how many lines/labels need to stack, not the
    // width -- on a narrow phone screen a width-based ratio left everything
    // crushed into a couple dozen pixels
    var padL=48, padT=14, padB=24;
    var H = Math.min(560, Math.max(260, topNames.length * 46 + padT + padB));
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var plotW = W-padL-padR, plotH = H-padT-padB;

    var minVotes = Infinity, maxVotes = -Infinity;
    pts.forEach(function(p){
      p[1].forEach(function(it){
        if(topNames.indexOf(it[0]) === -1) return;
        if(it[1] < minVotes) minVotes = it[1];
        if(it[1] > maxVotes) maxVotes = it[1];
      });
    });
    if(!isFinite(minVotes)){ minVotes = 0; maxVotes = 1; }

    // fit the y-axis to the range actually on screen -- when every shown
    // candidate already has a high vote count, the axis shouldn't waste
    // vertical space walking all the way down to 0
    var voteDomain = niceDomain(minVotes, maxVotes, 4);

    function xScale(t){ return padL + (t - tMin) / (tMax - tMin) * plotW; }
    function yScale(v){
      var s = (v - voteDomain.min) / (voteDomain.max - voteDomain.min);
      return padT + plotH - s * plotH;
    }

    var ns = 'http://www.w3.org/2000/svg';
    function el(tag, attrs){
      var e = document.createElementNS(ns, tag);
      for(var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    var ticks = voteDomain.ticks;
    ticks.forEach(function(v){
      var y = yScale(v);
      svg.appendChild(el('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'grid-line'}));
      var lbl = el('text',{x:padL-8,y:y+3,'text-anchor':'end',class:'axis-label'});
      lbl.textContent = formatVotes(v);
      svg.appendChild(lbl);
    });

    computeTimeTicks(tMin, tMax, 6).forEach(function(tv){
      var x = xScale(tv);
      var anchor = x < padL+28 ? 'start' : x > W-padR-28 ? 'end' : 'middle';
      var lbl = el('text',{x:x,y:H-6,'text-anchor':anchor,class:'axis-label'});
      lbl.textContent = formatClock(tv);
      svg.appendChild(lbl);
    });

    // index-based, not hashed: guarantees the up-to-6 lines on screen
    // together never share a color, at the cost of a name's color
    // shifting if its rank among the shown set changes between renders
    var topColors = topNames.map(function(name, idx){ return PALETTE[idx % PALETTE.length]; });

    var endpoints = [];
    topNames.forEach(function(name, idx){
      var color = topColors[idx];
      var d = '';
      var lastPt = null;
      pts.forEach(function(p){
        var match = p[1].filter(function(it){ return it[0]===name; })[0];
        if(!match){ lastPt = null; return; }
        var x = xScale(p[0]), y = yScale(match[1]);
        d += (lastPt ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
        lastPt = [x,y,match[1]];
      });
      if(d){
        svg.appendChild(el('path',{d:d.trim(), class:'line-path', stroke:color, opacity: idx<3?1:0.55}));
      }
      if(lastPt){
        endpoints.push({x:lastPt[0], y:lastPt[1], labelY:lastPt[1], name:name, votes:lastPt[2], color:color});
      }
    });

    // lay out labels top-to-bottom with a minimum gap, then -- if that ran
    // past the bottom edge -- compress from the bottom up instead of
    // shifting the whole block, which used to be able to push the topmost
    // label above the chart entirely when a couple of leaders towered over
    // a tightly bunched tail of near-zero candidates
    var minGap = 19, labelTop = padT + 8, labelBottom = padT + plotH - 4;
    endpoints.sort(function(a,b){ return a.y-b.y; });
    endpoints.forEach(function(ep, i){
      var minAllowed = i===0 ? labelTop : endpoints[i-1].labelY + minGap;
      ep.labelY = Math.max(ep.y, minAllowed);
    });
    var last = endpoints[endpoints.length-1];
    if(last && last.labelY > labelBottom){
      last.labelY = labelBottom;
      for(var k=endpoints.length-2;k>=0;k--){
        var maxAllowed = endpoints[k+1].labelY - minGap;
        if(endpoints[k].labelY > maxAllowed) endpoints[k].labelY = maxAllowed;
      }
    }
    endpoints.forEach(function(ep){
      ep.labelY = Math.min(Math.max(ep.labelY, labelTop), labelBottom);
    });

    endpoints.forEach(function(ep){
      // a dot always marks the real last value; when collision-avoidance
      // has pushed the label away from it (common when a couple of huge
      // leaders squeeze a cluster of near-zero candidates together), a
      // connector traces the label back to the line it actually belongs
      // to -- color alone isn't enough once several lines share a hue
      // family or the shift is large
      svg.appendChild(el('circle',{cx:ep.x, cy:ep.y, r:2.5, fill:ep.color}));
      if(Math.abs(ep.labelY - ep.y) > 3){
        svg.appendChild(el('line',{
          x1:ep.x+3, y1:ep.y, x2:ep.x+8, y2:ep.labelY,
          stroke:ep.color, 'stroke-width':1, opacity:0.6, 'stroke-dasharray':'2,2'
        }));
      }
      var lbl = el('text',{x:ep.x+10, y:ep.labelY+4, class:'line-end-label', fill:ep.color});
      lbl.textContent = displayName(ep.name);
      svg.appendChild(lbl);
    });

    svg.appendChild(el('g', {id:'hoverLayer'}));

    chartState = {
      pts:pts, topNames:topNames, colors:topColors,
      xScale:xScale, yScale:yScale,
      padL:padL, padR:padR, padT:padT, plotW:plotW, plotH:plotH,
      W:W, H:H, tMin:tMin, tMax:tMax
    };
  }

  // ---------- rendering: chart hover / tooltip ----------

  function hideChartHover(){
    var svg = $('bumpChart');
    var layer = svg && svg.querySelector('#hoverLayer');
    if(layer){ while(layer.firstChild) layer.removeChild(layer.firstChild); }
    var tooltip = $('chartTooltip');
    if(tooltip) tooltip.classList.remove('visible');
  }

  function nearestPoint(svgX){
    var cs = chartState;
    var clampedX = Math.min(Math.max(svgX, cs.padL), cs.W - cs.padR);
    var t = cs.tMin + (clampedX - cs.padL) / cs.plotW * (cs.tMax - cs.tMin);
    var idx = 0, bestDiff = Infinity;
    for(var i=0;i<cs.pts.length;i++){
      var diff = Math.abs(cs.pts[i][0] - t);
      if(diff < bestDiff){ bestDiff = diff; idx = i; }
    }
    return cs.pts[idx];
  }

  function handleChartPointer(evt){
    if(!chartState) return;
    var svg = $('bumpChart');
    var rect = svg.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    var vb = svg.viewBox.baseVal;
    var svgX = (evt.clientX - rect.left) * (vb.width / rect.width);
    var point = nearestPoint(svgX);
    if(!point) return;

    var cs = chartState;
    var ns = 'http://www.w3.org/2000/svg';
    function el(tag, attrs){
      var e = document.createElementNS(ns, tag);
      for(var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    var layer = svg.querySelector('#hoverLayer');
    if(!layer) return;
    while(layer.firstChild) layer.removeChild(layer.firstChild);

    var x = cs.xScale(point[0]);
    layer.appendChild(el('line',{x1:x,y1:cs.padT,x2:x,y2:cs.padT+cs.plotH,class:'hover-line'}));

    var rows = [];
    cs.topNames.forEach(function(name, i){
      var match = point[1].filter(function(it){ return it[0]===name; })[0];
      if(!match) return;
      var y = cs.yScale(match[1]);
      layer.appendChild(el('circle',{cx:x, cy:y, r:3.5, fill:cs.colors[i], class:'hover-dot'}));
      rows.push({name:name, votes:match[1], color:cs.colors[i]});
    });
    rows.sort(function(a,b){ return b.votes - a.votes; });

    var tooltip = $('chartTooltip');
    var html = '<div class="chart-tooltip-time">' + formatClock(point[0]) + '</div>';
    rows.forEach(function(r){
      html +=
        '<div class="chart-tooltip-row">' +
          '<span class="chart-tooltip-dot" style="background:' + r.color + '"></span>' +
          '<span class="chart-tooltip-name">' + escapeHtml(displayName(r.name)) + '</span>' +
          '<span class="chart-tooltip-value">' + formatVotes(r.votes) + '</span>' +
        '</div>';
    });
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');

    var wrapRect = svg.parentElement.getBoundingClientRect();
    var pxX = evt.clientX - wrapRect.left;
    var pxY = evt.clientY - wrapRect.top;
    var tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    var left = pxX + 14;
    if(left + tw > wrapRect.width) left = pxX - tw - 14;
    if(left < 4) left = 4;
    var top = pxY - th/2;
    if(top < 4) top = 4;
    if(top + th > wrapRect.height - 4) top = wrapRect.height - th - 4;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function initChartHover(){
    var svg = $('bumpChart');
    // pointer events cover mouse+touch+pen in every modern browser; mouse
    // events are listened for too since some embedding/automation contexts
    // only dispatch the older event family
    ['pointermove','pointerdown','mousemove'].forEach(function(evtName){
      svg.addEventListener(evtName, function(evt){
        try{ handleChartPointer(evt); }catch(e){ console.error(e); }
      });
    });
    ['pointerleave','pointercancel','mouseleave'].forEach(function(evtName){
      svg.addEventListener(evtName, function(){
        try{ hideChartHover(); }catch(e){ console.error(e); }
      });
    });
  }

  // ---------- top-level render / lifecycle ----------

  function renderAll(){
    try{
      renderPodium();
      renderRankList();
      renderRangeNote();
      renderChart();
      var snap = latestSnapshot();
      $('updatedAt').textContent = formatUpdatedAt(snap ? snap[0] : null);
      var dot = $('liveDot');
      var stale = !snap || (Date.now()/1000 - snap[0]) > 20*60;
      dot.classList.toggle('stale', stale);
    }catch(e){
      console.error('renderAll failed', e);
      showError('畫面更新時發生問題，稍後會自動重試。');
    }
  }

  function refresh(){
    fetchAll().then(function(results){
      var anyOk = results.some(function(r){ return r.status === 'fulfilled'; });
      if(!anyOk){
        showError('目前無法取得最新資料，稍後將自動重試。');
      }
      renderAll();
    }).catch(function(e){
      console.error('refresh failed', e);
      showError('目前無法取得最新資料，稍後將自動重試。');
    });
  }

  function init(){
    renderSelector();
    renderRangePicker();
    initChartHover();
    refresh();

    if(state.refreshTimer) clearInterval(state.refreshTimer);
    state.refreshTimer = setInterval(function(){
      try{ refresh(); }catch(e){ console.error(e); showError('自動更新時發生問題。'); }
    }, 60*1000);
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      try{ renderChart(); }catch(e){ console.error(e); }
    }, 150);
  });

  window.addEventListener('error', function(ev){
    console.error('uncaught error', ev.error || ev.message);
    showError('發生非預期的錯誤，畫面會盡量維持運作。');
  });
  window.addEventListener('unhandledrejection', function(ev){
    console.error('unhandled rejection', ev.reason);
  });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
