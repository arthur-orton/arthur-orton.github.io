# Manual/backup collector. The regular per-minute collection runs on a
# Cloudflare Worker Cron Trigger (see ../../vote-monitor-collector) since
# GitHub's own schedule trigger is best-effort and can lag by hours.
name: Collect vote snapshots

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-vote-snapshots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest snapshot
        run: python3 scripts/collect.py

      - name: Commit and push if data changed
        run: |
          git config user.name "vote-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/; then
            git add data/
            git commit -m "chore: update vote snapshots"
            git push
          else
            echo "no changes"
          fi
